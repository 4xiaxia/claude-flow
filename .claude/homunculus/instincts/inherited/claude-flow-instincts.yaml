# Claude Flow Workflow Dependency Update Across Monorepo

## Action

Follow the dependency-update-across-monorepo workflow:
1. Identify outdated dependencies in multiple package.json files.
2. Update the version(s) of the dependency in each relevant package.json.
3. Update corresponding lockfiles (package-lock.json, pnpm-lock.yaml) in each directory.
4. Commit all changed package.json and lockfile(s) together with a detailed changelog in the commit message.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: package.json, package-lock.json, pnpm-lock.yaml

